<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>Verity panel</title>
    <!-- chrome.css holds the palette and the panel components; panel.css only
         adapts them to a document that *is* the panel. -->
    <link rel="stylesheet" href="chrome.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div id="panel">
      <div class="panel-head">
        <span id="head-icon" aria-hidden="true"></span>
        <h2 id="head-title">Shield</h2>
        <button id="close" class="icon-btn small" type="button" aria-label="Close panel"></button>
      </div>
      <div class="panel-body" id="body"></div>
    </div>
    <script src="icons.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
