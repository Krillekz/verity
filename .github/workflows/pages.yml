name: Publish the site

# Builds docs/ with the project's own generator and publishes it to GitHub Pages.
#
# The site is not hand-written: tools/build-site.js lifts the mascot, the palette
# and the privacy engine out of src/ into docs/assets/, then reloads what it wrote
# and compares it against the app. So this workflow rebuilds first and fails if
# that changes anything — a page that describes an older browser than the one in
# the repository is a lie, and it should break the build rather than ship.
#
# No npm install: the generator uses only Node's standard library, and it stubs
# out the one Electron import it needs (see the comment in tools/build-site.js).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild the site from src/
        run: node tools/build-site.js

      - name: Fail if the committed site is stale
        run: |
          if ! git diff --quiet -- docs; then
            echo "docs/ is out of date with src/. Run 'npm run site' and commit the result."
            git diff --stat -- docs
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
